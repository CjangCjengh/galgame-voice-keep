<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f3f5f7">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <script>document.documentElement.dataset.theme=localStorage.getItem('theme')||'';</script>
    <script src="{{ '/assets/app.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="トップページへ">ボイスキープ化メモ</a>
        <nav class="site-nav" aria-label="メインナビゲーション">
          <a href="{{ '/' | relative_url }}#search">ゲームを探す</a>
          <a href="{{ '/' | relative_url }}#about">収録基準</a>
          <a href="https://github.com/CjangCjengh/galgame-voice-keep">GitHub</a>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="表示テーマを切り替える"><span class="theme-icon" aria-hidden="true"></span>表示切替</button>
        </nav>
      </div>
    </header>

    <main id="main">{{ content }}</main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>ゲーム本体、シナリオ、画像、音声は含まれていません。</p>
        <div>
          <a href="https://github.com/CjangCjengh/galgame-voice-keep">ソースを見る</a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/CjangCjengh/galgame-voice-keep/blob/main/LICENSE">MIT License</a>
        </div>
      </div>
    </footer>
  </body>
</html>
